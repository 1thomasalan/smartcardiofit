<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1420">
<title>Stillness</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--txt:#eef1f6;--mut:rgba(238,241,246,.55);--line:rgba(255,255,255,.12);--glow:#f3d9a4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--txt);font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;overflow:hidden;background:#0e1420}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.sky{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 110%,#c98f6b 0%,#6d5a7a 28%,#2b3352 55%,#0e1420 85%);transition:filter 3s}
.sky::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.06) 0 1px,transparent 2px) 0 0/90px 90px,radial-gradient(circle at 70% 40%,rgba(255,255,255,.05) 0 1px,transparent 2px) 0 0/130px 130px}
body.sitting .sky{filter:brightness(.55) saturate(.8)}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 22px) 26px calc(env(safe-area-inset-bottom) + 26px);max-width:640px;margin:0 auto}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;font-family:system-ui,sans-serif;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);transition:opacity 1.5s}
.quote{margin-top:6vh;text-align:center;max-width:460px;transition:opacity 1.5s}
.quote p{font-size:clamp(20px,5.4vw,27px);line-height:1.45;font-style:italic;margin:0}
.quote small{display:block;margin-top:14px;font-family:system-ui,sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
.orbwrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.orb{position:relative;width:min(58vw,260px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column}
.orb::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 45%,rgba(255,236,200,.28),rgba(243,217,164,.08) 60%,transparent 72%);box-shadow:0 0 80px rgba(243,217,164,.18);animation:breathe 10s ease-in-out infinite}
body:not(.sitting) .orb::before{animation-duration:14s}
@keyframes breathe{0%,100%{transform:scale(.82);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.orb svg{position:absolute;inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px);transform:rotate(-90deg)}
.time{position:relative;font-family:system-ui,sans-serif;font-weight:200;font-size:clamp(48px,14vw,68px);letter-spacing:1px;font-variant-numeric:tabular-nums}
.hint{position:relative;font-family:system-ui,sans-serif;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--mut);margin-top:6px;min-height:16px}
.picker{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-family:system-ui,sans-serif;transition:opacity 1s}
.picker button{min-width:52px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);font-size:15px;color:var(--mut);backdrop-filter:blur(6px)}
.picker button.on{border-color:var(--glow);color:var(--txt);background:rgba(243,217,164,.12)}
.go{margin-top:22px;width:84px;height:84px;border-radius:50%;border:1px solid rgba(243,217,164,.6);display:grid;place-items:center;background:rgba(243,217,164,.08);box-shadow:0 0 40px rgba(243,217,164,.15)}
.go svg{width:28px;height:28px;fill:var(--txt)}
.row2{display:flex;gap:26px;margin-top:18px;font-family:system-ui,sans-serif;font-size:13px;color:var(--mut);transition:opacity 1s}
.row2 button{letter-spacing:1px}
body.sitting .hide{opacity:0;pointer-events:none}
.sheet{position:fixed;left:0;right:0;bottom:0;background:rgba(14,20,32,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px 24px calc(env(safe-area-inset-bottom) + 28px);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);font-family:system-ui,sans-serif;max-width:640px;margin:0 auto;z-index:5}
.sheet.show{transform:none}
.sheet h3{font-family:Georgia,serif;font-weight:400;font-size:22px;margin:0 0 16px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.seg{display:flex;gap:6px}.seg button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--mut)}.seg button.on{border-color:var(--glow);color:var(--txt)}
.stats{display:flex;justify-content:space-around;text-align:center;margin:6px 0 10px}.stats b{display:block;font-family:Georgia,serif;font-weight:400;font-size:30px}.stats span{font-size:12px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}
.close{position:absolute;top:16px;right:20px;font-size:22px;color:var(--mut)}
input[type=range]{width:100%;accent-color:#f3d9a4}
.end{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px;z-index:4}
.end.show{display:flex;animation:fade 2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.end h2{font-weight:400;font-size:30px;margin:0}.end p{color:var(--mut);font-family:system-ui,sans-serif;font-size:14px;letter-spacing:1px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.3s;z-index:4}.scrim.show{opacity:1;pointer-events:auto}

:root{--sky:radial-gradient(120% 80% at 50% 110%,#c98f6b 0%,#6d5a7a 28%,#2b3352 55%,#0e1420 85%)}
body[data-theme=dawn]{--sky:radial-gradient(120% 80% at 50% 110%,#ffd3a5 0%,#f2a7a0 26%,#8f8bc6 56%,#34416e 92%);--glow:#fff1d6}
body[data-theme=ocean]{--sky:radial-gradient(120% 80% at 50% 110%,#6fd6d6 0%,#2b7a9e 28%,#173a5e 58%,#07142a 90%);--glow:#c8f6f2}
body[data-theme=forest]{--sky:radial-gradient(120% 80% at 50% 110%,#b9cc8c 0%,#55806a 28%,#1f3b33 58%,#0a1613 90%);--glow:#e6f2c4}
body[data-theme=sakura]{--sky:radial-gradient(120% 80% at 50% 110%,#ffd3de 0%,#e59ab5 27%,#7a5a85 57%,#1f1830 90%);--glow:#ffe3ec}
body[data-theme=midnight]{--sky:radial-gradient(120% 80% at 50% 110%,#1b2131 0%,#090b11 50%,#000 85%);--glow:#cfd8ec}
.sky{background:var(--sky)!important}
#arc{stroke:var(--glow)}
.orb::before{background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--glow) 32%,transparent),color-mix(in srgb,var(--glow) 9%,transparent) 60%,transparent 72%)!important}
body.guided.sitting .orb::before{animation:none!important;transform:scale(var(--s,.9));opacity:calc(.55 + (var(--s,.9) - .8) * 1.6);transition:transform .3s linear,opacity .3s linear}
body[data-orb=ring] .orb::before{background:none!important;box-shadow:none;border:1px solid color-mix(in srgb,var(--glow) 45%,transparent)}
body[data-orb=minimal] .orb::before,body[data-orb=minimal] .orb svg{display:none}
body.notime .time{opacity:0}
body.keepquote.sitting #quote{opacity:.85!important}
.quote{width:100%}
.qtools{width:100%;margin-top:14px;display:flex;justify-content:space-between;align-items:center}
.qtools button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--mut);backdrop-filter:blur(6px);background:rgba(255,255,255,.04)}
.qtools button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.qtools button:active{background:rgba(255,255,255,.12)}
.top button#menuBtn{font-size:20px;letter-spacing:0;filter:grayscale(.3);opacity:.85}
.sec{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin:20px 0 2px}
.sheet{max-height:82vh;overflow-y:auto}
.seg{flex-wrap:wrap;justify-content:flex-end}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 4px}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid transparent;position:relative}
.sw.on{border-color:#fff}
.sw small{position:absolute;top:48px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mut);white-space:nowrap}
.swrow{padding-bottom:18px}
</style>
</head>
<body>
<div class="sky"></div>
<div class="wrap">
  <div class="top hide"><span id="date"></span><button id="menuBtn" aria-label="Settings">⚙️</button></div>
  <div class="quote hide" id="quote"><p id="qt"></p><small id="qa"></small><div class="qtools"><button id="qNext" aria-label="Another quote"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button><button id="qShare" aria-label="Share quote"><svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button></div></div>
  <div class="orbwrap">
    <div class="orb" id="orb">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="none" stroke="rgba(255,255,255,.08)" stroke-width=".6"/><circle id="arc" cx="50" cy="50" r="48" fill="none" stroke="#f3d9a4" stroke-width=".9" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="301.6"/></svg>
      <div class="time" id="time">10:00</div>
      <div class="hint" id="hint">breathe</div>
    </div>
  </div>
  <div class="picker hide" id="picker"></div>
  <button class="go" id="go" aria-label="Begin"><svg viewBox="0 0 24 24" id="goIcon"><path d="M8 5v14l11-7z"/></svg></button>
  <div class="row2 hide"><button id="statsBtn">Journey</button></div>
</div>

<div class="end" id="end"><h2>Be well, Alan.</h2><p id="endmsg"></p><button class="go" id="endOk" style="width:64px;height:64px;font-family:system-ui;font-size:13px;letter-spacing:1px">OK</button></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><button class="close" id="closeSheet">×</button><div id="sheetBody"></div></div>

<script>
const QUOTES=[

["Stillness is where creativity and solutions to problems are found.","Eckhart Tolle"],

["Slow down and everything you are chasing will come around and catch you.","John De Paola"],
["Your calm mind is the ultimate weapon against your challenges.","Bryant McGill"],
["Inhale the future, exhale the past.","Unknown"],
["One today is worth two tomorrows.","Benjamin Franklin"]
];
const KEY='stillness-v1';
const D={min:10,sound:'bowl',start:true,interval:0,log:{},vol:.8,theme:'dusk',orb:'glow',showTime:true,keepQuote:false,prep:0,breath:'natural',ambient:'off',ambVol:.5,strikes:3,vib:true};
let S=Object.assign({},D,JSON.parse(localStorage.getItem(KEY)||'{}'));const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const $=id=>document.getElementById(id);
const ds=d=>{const z=new Date(d);z.setMinutes(z.getMinutes()-z.getTimezoneOffset());return z.toISOString().slice(0,10)};
const today=()=>ds(new Date());
const THEMES={dusk:['Dusk','#0e1420','linear-gradient(#2b3352,#c98f6b)'],dawn:['Dawn','#34416e','linear-gradient(#8f8bc6,#ffd3a5)'],ocean:['Ocean','#07142a','linear-gradient(#173a5e,#6fd6d6)'],forest:['Forest','#0a1613','linear-gradient(#1f3b33,#b9cc8c)'],sakura:['Sakura','#1f1830','linear-gradient(#7a5a85,#ffd3de)'],midnight:['Midnight','#000000','linear-gradient(#000,#1b2131)']};
function applyLook(){document.body.dataset.theme=S.theme;document.body.dataset.orb=S.orb;document.body.classList.toggle('notime',!S.showTime);document.body.classList.toggle('keepquote',S.keepQuote);document.body.classList.toggle('guided',S.breath!=='natural');document.querySelector('meta[name=theme-color]').content=THEMES[S.theme][1]}
applyLook();

// quotes
let qi;function dayIndex(){const d=new Date();return (Math.floor((d-new Date(d.getFullYear(),0,0))/864e5)+d.getFullYear()*7)%QUOTES.length}
function showQuote(i){qi=i;const q=QUOTES[i];const el=$('quote');el.style.opacity=0;setTimeout(()=>{$('qt').textContent='“'+q[0]+'”';$('qa').textContent=q[1];el.style.opacity=''},qi===undefined?0:400)}
qi=dayIndex();$('qt').textContent='“'+QUOTES[qi][0]+'”';$('qa').textContent=QUOTES[qi][1];
$('qNext').onclick=()=>{let n;do{n=Math.random()*QUOTES.length|0}while(n===qi);showQuote(n)};
const CARD={dusk:['#0e1420','#2b3352','#6d5a7a','#c98f6b','#f3d9a4'],dawn:['#34416e','#8f8bc6','#f2a7a0','#ffd3a5','#fff1d6'],ocean:['#07142a','#173a5e','#2b7a9e','#6fd6d6','#c8f6f2'],forest:['#0a1613','#1f3b33','#55806a','#b9cc8c','#e6f2c4'],sakura:['#1f1830','#7a5a85','#e59ab5','#ffd3de','#ffe3ec'],midnight:['#000000','#090b11','#141a28','#1b2131','#cfd8ec']};
function quoteCard(){const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const p=CARD[S.theme]||CARD.dusk;
 const g=x.createRadialGradient(W/2,H*1.15,0,W/2,H*1.15,H*1.05);g.addColorStop(0,p[3]);g.addColorStop(.3,p[2]);g.addColorStop(.6,p[1]);g.addColorStop(.95,p[0]);x.fillStyle=p[0];x.fillRect(0,0,W,H);x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<70;i++){const sx=(i*397)%W,sy=(i*233)%(H*.55);x.beginPath();x.arc(sx,sy,(i%3)*.7+.6,0,7);x.fill()}
 const og=x.createRadialGradient(W/2,H*.78,0,W/2,H*.78,260);og.addColorStop(0,p[4]+'66');og.addColorStop(1,p[4]+'00');x.fillStyle=og;x.beginPath();x.arc(W/2,H*.78,260,0,7);x.fill();
 x.strokeStyle=p[4]+'aa';x.lineWidth=3;x.beginPath();x.arc(W/2,H*.78,150,0,7);x.stroke();
 const q=QUOTES[qi];x.fillStyle='#f4f1ea';x.textAlign='center';let fs=64;let lines;
 const wrap=(t,f)=>{x.font=`italic ${f}px Georgia, 'Times New Roman', serif`;const w=t.split(' '),L=[];let l='';w.forEach(wd=>{const tt=l?l+' '+wd:wd;if(x.measureText(tt).width>W-200&&l){L.push(l);l=wd}else l=tt});L.push(l);return L};
 do{lines=wrap('“'+q[0]+'”',fs);fs-=4}while(lines.length*fs*1.4>H*.48&&fs>34);fs+=4;
 const lh=fs*1.42,top=H*.36-lines.length*lh/2;lines.forEach((l,i)=>x.fillText(l,W/2,top+i*lh+fs));
 x.font='500 30px system-ui, sans-serif';x.fillStyle='rgba(244,241,234,.7)';x.letterSpacing='6px';x.fillText(q[1].toUpperCase(),W/2,top+lines.length*lh+fs+40);
 x.font='26px system-ui, sans-serif';x.fillStyle='rgba(244,241,234,.55)';x.fillText('STILLNESS',W/2,H-70);
 return new Promise(r=>c.toBlob(r,'image/png'))}
$('qShare').onclick=async()=>{const q=QUOTES[qi];const text=`“${q[0]}” — ${q[1]}`;
 try{const blob=await quoteCard();const file=new File([blob],'stillness-quote.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stillness-quote.png';a.click();
 }catch(e){if(e&&e.name==='AbortError')return;try{await navigator.clipboard.writeText(text)}catch(_){}}};
$('date').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

// picker
const MINS=[1,3,5,10,15,20,30];
function drawPicker(){$('picker').innerHTML=MINS.map(m=>`<button class="${S.min===m?'on':''}" data-m="${m}">${m}</button>`).join('')+`<button class="${MINS.includes(S.min)?'':'on'}" id="custom">${MINS.includes(S.min)?'…':S.min}</button>`;
 document.querySelectorAll('#picker [data-m]').forEach(b=>b.onclick=()=>{S.min=+b.dataset.m;save();drawPicker();showTime(S.min*60)});
 $('custom').onclick=openCustom;}
const fmt=s=>{s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')};
function showTime(s){$('time').textContent=fmt(s)}
drawPicker();showTime(S.min*60);
const SNAME={bowl:'Bowl',gong:'Gong',chime:'Chime'};$('soundBtn')&&($('soundBtn').textContent=SNAME[S.sound]);

// ---- bells ----
let ac,silentEl;
// iOS: play through the ring/silent switch and keep the audio session alive
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(_){}
function silentUrl(){const n=8000,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
 return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function ctx(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running'){try{ac.resume()}catch(_){}}return ac}
function unlockAudio(){const a=ctx();try{const b=a.createBuffer(1,1,22050),src=a.createBufferSource();src.buffer=b;src.connect(a.destination);src.start(0)}catch(_){}
 if(!silentEl){silentEl=new Audio(silentUrl());silentEl.loop=true;silentEl.setAttribute('playsinline','');silentEl.volume=0.01}
 const pr=silentEl.play();if(pr&&pr.catch)pr.catch(()=>{});if(!T)setTimeout(()=>{if(!T&&silentEl)silentEl.pause()},1500)}
['pointerdown','touchend','click'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ac)ctx()});
function strike(type=S.sound,gain=S.vol){
 const a=ctx(),t=a.currentTime,out=a.createGain();out.gain.value=gain;
 const dl=a.createDelay();dl.delayTime.value=.13;const fb=a.createGain();fb.gain.value=.28;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
 out.connect(a.destination);out.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(a.destination);
 const P={bowl:{f:220,parts:[[1,1,9],[2.76,.5,6],[5.40,.25,4],[8.93,.12,2.5],[1.006,.6,9]]},
          gong:{f:98,parts:[[1,1,10],[1.52,.6,8],[2.01,.5,7],[2.83,.35,5],[3.6,.25,4],[4.9,.15,3],[1.008,.7,10]]},
          chime:{f:880,parts:[[1,1,4.5],[2.4,.35,3],[3.9,.18,2],[5.4,.09,1.5],[1.003,.5,4.5]]}}[type];
 P.parts.forEach(([r,amp,dec])=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=P.f*r;
  if(type==='gong'){o.frequency.setValueAtTime(P.f*r*1.02,t);o.frequency.exponentialRampToValueAtTime(P.f*r,t+1.2)}
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(amp*.22,t+(type==='gong'?.06:.008));g.gain.exponentialRampToValueAtTime(.0001,t+dec);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+dec+.1)});
 if(type==='gong'){const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*.4,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);n.buffer=b;const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=180;const g=a.createGain();g.gain.value=.25;n.connect(bp);bp.connect(g);g.connect(out);n.start(t)}
}
function finalBell(){const gap=S.sound==='chime'?2200:4200;strike();if(S.strikes>1){setTimeout(()=>strike(S.sound,S.vol*.75),gap);setTimeout(()=>strike(S.sound,S.vol*.55),gap*2)}}

// ---- ambient soundscapes ----
let amb=null;
function noiseBuf(a,kind){const len=a.sampleRate*4,b=a.createBuffer(2,len,a.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;if(kind==='brown'){last=(last+.02*w)/1.02;d[i]=last*3.5}else d[i]=w}}return b}
function startAmbient(kind=S.ambient,preview=false){
 stopAmbient(0);if(kind==='off')return;
 const a=ctx(),t=a.currentTime,master=a.createGain();master.gain.setValueAtTime(0,t);master.gain.linearRampToValueAtTime(S.ambVol*.6,t+(preview?.5:4));master.connect(a.destination);
 const nodes=[];const src=b=>{const s=a.createBufferSource();s.buffer=b;s.loop=true;s.start();nodes.push(s);return s};
 const lfo=(f,depth,target)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=depth;o.connect(g);g.connect(target);o.start();nodes.push(o)};
 if(kind==='rain'){const s=src(noiseBuf(a,'white'));const hp=a.createBiquadFilter();hp.type='highpass';hp.frequency.value=500;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4500;const g=a.createGain();g.gain.value=.35;s.connect(hp);hp.connect(lp);lp.connect(g);g.connect(master);
   const s2=src(noiseBuf(a,'brown'));const g2=a.createGain();g2.gain.value=.5;s2.connect(g2);g2.connect(master)}
 if(kind==='ocean'){const s=src(noiseBuf(a,'brown'));const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=650;const g=a.createGain();g.gain.value=.55;lfo(.075,.45,g.gain);lfo(.075,400,lp.frequency);s.connect(lp);lp.connect(g);g.connect(master)}
 if(kind==='brown'){const s=src(noiseBuf(a,'brown'));const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;s.connect(lp);lp.connect(master)}
 if(kind==='om'){[[136.1,.22],[204.15,.09],[272.2,.07],[136.6,.15]].forEach(([f,v])=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(master);o.start();nodes.push(o)});const tg=a.createGain();master.disconnect();master.connect(tg);tg.connect(a.destination);tg.gain.value=.8;lfo(.1,.2,tg.gain)}
 amb={master,nodes};
}
function stopAmbient(fade=3){if(!amb)return;const a=ctx(),{master,nodes}=amb;amb=null;const t=a.currentTime;master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(master.gain.value,t);master.gain.linearRampToValueAtTime(0,t+fade+.05);setTimeout(()=>nodes.forEach(n=>{try{n.stop()}catch(_){}}),(fade+.2)*1000)}
let previewTimer;function previewAmbient(k){clearTimeout(previewTimer);startAmbient(k,true);previewTimer=setTimeout(()=>{if(!T)stopAmbient(1.5)},5000)}

// ---- breathing guide ----
const BREATH={natural:null,calm:[['breathe in',4],['breathe out',6]],box:[['breathe in',4],['hold',4],['breathe out',4],['hold',4]],relax:[['breathe in',4],['hold',7],['breathe out',8]]};
function breathState(el){const p=BREATH[S.breath];const cyc=p.reduce((a,x)=>a+x[1],0);let t=el%cyc,lvl=.82;for(let i=0;i<p.length;i++){const [n,d]=p[i];if(t<d){const f=t/d;if(n==='breathe in')lvl=.82+.26*f;else if(n==='breathe out')lvl=1.08-.26*f;else lvl=(i>0&&p[i-1][0]==='breathe in')?1.08:.82;return [n,lvl,Math.ceil(d-t)]}t-=d}return ['',lvl,0]}

// ---- timer ----
let T=null,wake=null;const C=301.6;
async function begin(){
 ctx();try{wake=await navigator.wakeLock.request('screen')}catch(_){}
 document.body.classList.add('sitting');const total=S.min*60;
 T={total,paused:false,remain:total,lastInt:0,prep:S.prep,prepEnd:Date.now()+S.prep*1000,started:false};
 setGo('pause');T.iv=setInterval(loop,200);
 if(!S.prep)startSit();else{$('hint').textContent='get comfortable';}
 loop();
}
function startSit(){T.started=true;if(silentEl){const pr=silentEl.play();if(pr&&pr.catch)pr.catch(()=>{})}T.end=Date.now()+T.total*1000;if(S.start)strike(S.sound,S.vol*.6);startAmbient()}
function loop(){
 if(T.paused)return;
 if(!T.started){const r=(T.prepEnd-Date.now())/1000;$('time').textContent=Math.max(1,Math.ceil(r));$('hint').textContent='get comfortable';if(r<=0)startSit();return}
 T.remain=(T.end-Date.now())/1000;const el=T.total-T.remain;
 $('arc').style.strokeDashoffset=C*(1-Math.min(1,el/T.total));showTime(T.remain);
 if(S.breath==='natural')$('hint').textContent=el<8?'settle in':(Math.floor(el/5)%2?'breathe out':'breathe in');
 else{const [n,l,c]=breathState(el);document.body.style.setProperty('--s',l);$('hint').textContent=n+(c?' · '+c:'')}
 if(S.interval&&el>0){const k=Math.floor(el/(S.interval*60));if(k>T.lastInt&&T.remain>5){T.lastInt=k;strike(S.sound,S.vol*.4)}}
 if(amb&&T.remain<8&&!T.fading){T.fading=true;stopAmbient(Math.max(1,T.remain))}
 if(T.remain<=0)complete();
}
function pauseResume(){
 if(!T)return begin();
 if(T.paused){if(T.started)T.end=Date.now()+T.remain*1000;else T.prepEnd=Date.now()+1000;T.paused=false;setGo('pause');document.body.classList.add('sitting');if(T.started&&S.ambient!=='off'&&!amb)startAmbient()}
 else{T.paused=true;setGo('play');$('hint').textContent='paused · hold to end';document.body.classList.remove('sitting');stopAmbient(1.5)}
}
function stop(record){
 clearInterval(T.iv);try{wake&&wake.release()}catch(_){}wake=null;stopAmbient(2);
 const sat=T.started?Math.round(T.total-Math.max(0,T.remain)):0;
 if(record&&sat>=30){const l=S.log[today()]||{n:0,s:0};l.n++;l.s+=sat;S.log[today()]=l;save()}
 T=null;setTimeout(()=>{if(!T&&silentEl)silentEl.pause()},15000);document.body.classList.remove('sitting');setGo('play');$('arc').style.strokeDashoffset=C;showTime(S.min*60);$('hint').textContent='breathe';return sat;
}
function complete(){const total=T.total;stop(true);finalBell();if(S.vib&&navigator.vibrate)navigator.vibrate([400,200,400]);
 $('endmsg').textContent=`${Math.round(total/60)} minute${total>=120?'s':''} of stillness · ${streak()} day${streak()===1?'':'s'} in a row`;$('end').classList.add('show')}
$('endOk').onclick=()=>$('end').classList.remove('show');
function setGo(s){$('goIcon').innerHTML=s==='pause'?'<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>':'<path d="M8 5v14l11-7z"/>'}
let lp;const go=$('go');
go.addEventListener('pointerdown',()=>{lp=setTimeout(()=>{lp=null;if(T){stop(true);if(navigator.vibrate)navigator.vibrate(60)}},800)});
go.addEventListener('pointerup',()=>{if(lp){clearTimeout(lp);lp=null;pauseResume()}});
go.addEventListener('pointerleave',()=>{if(lp){clearTimeout(lp);lp=null}});
function streak(){let n=0,d=new Date();if(!S.log[ds(d)])d.setDate(d.getDate()-1);while(S.log[ds(d)]){n++;d.setDate(d.getDate()-1)}return n}

// ---- sheets ----
function openSheet(html){$('sheetBody').innerHTML=html;$('sheet').classList.add('show');$('scrim').classList.add('show');$('sheet').scrollTop=0}
function closeSheet(){$('sheet').classList.remove('show');$('scrim').classList.remove('show')}
$('closeSheet').onclick=closeSheet;$('scrim').onclick=closeSheet;
function openCustom(){openSheet(`<h3>Custom length</h3><div class="opt"><span>Minutes</span><b id="cv">${S.min}</b></div><input type="range" min="1" max="90" value="${S.min}" id="cr" style="margin-top:14px">`);
 $('cr').oninput=e=>{S.min=+e.target.value;$('cv').textContent=S.min;showTime(S.min*60)};$('cr').onchange=()=>{save();drawPicker()}}
const seg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-k="${k}" data-v="${v}" class="${String(S[k])===String(v)?'on':''}">${l}</button>`).join('')}</div>`;
function wireSegs(){document.querySelectorAll('.sheet .seg button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;let v=b.dataset.v;v=v==='true'?true:v==='false'?false:isNaN(v)?v:+v;S[k]=v;save();b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
 if(k==='sound'){strike(v)}
 if(k==='ambient')previewAmbient(v);
 applyLook()})}
function settings(){
 const sw=Object.entries(THEMES).map(([k,[n,,g]])=>`<button class="sw ${S.theme===k?'on':''}" data-theme="${k}" style="background:${g}"><small>${n}</small></button>`).join('');
 openSheet(`<h3>Settings</h3>
 <div class="sec">Look</div>
 <div class="swrow"><div class="swatches">${sw}</div></div>
 <div class="opt"><span>Orb</span>${seg('orb',[['glow','Glow'],['ring','Ring'],['minimal','Minimal']])}</div>
 <div class="opt"><span>Show countdown</span>${seg('showTime',[[true,'On'],[false,'Off']])}</div>
 <div class="opt"><span>Quote while sitting</span>${seg('keepQuote',[[false,'Hide'],[true,'Show']])}</div>
 <div class="sec">Session</div>
 <div class="opt"><span>Settle-in time</span>${seg('prep',[[0,'Off'],[10,'10s'],[30,'30s']])}</div>
 <div class="opt"><span>Breathing guide</span>${seg('breath',[['natural','Natural'],['calm','4·6'],['box','Box'],['relax','4·7·8']])}</div>
 <div class="opt"><span>Background</span>${seg('ambient',[['off','Silence'],['rain','Rain'],['ocean','Ocean'],['brown','Hush'],['om','Om']])}</div>
 <div class="opt" style="border:0"><span>Background volume</span></div><input type="range" min="0.05" max="1" step="0.05" value="${S.ambVol}" id="avol">
 <div class="sec">Bells</div>
 <div class="opt"><span>Ending sound</span>${seg('sound',[['bowl','Bowl'],['gong','Gong'],['chime','Chime']])}</div>
 <div class="opt"><span>Ending strikes</span>${seg('strikes',[[1,'1'],[3,'3']])}</div>
 <div class="opt"><span>Starting bell</span>${seg('start',[[true,'On'],[false,'Off']])}</div>
 <div class="opt"><span>Interval bell</span>${seg('interval',[[0,'Off'],[1,'1m'],[5,'5m'],[10,'10m']])}</div>
 <div class="opt"><span>Vibrate at end</span>${seg('vib',[[true,'On'],[false,'Off']])}</div>
 <div class="opt" style="border:0"><span>Bell volume</span></div><input type="range" min="0.1" max="1" step="0.05" value="${S.vol}" id="vol">
 <div class="sec">More</div>
 <div class="opt"><button id="resetLook">Restore original look & sound</button></div>
 <p style="color:var(--mut);line-height:1.6;font-size:13px">Tap the circle to begin or pause, hold it to end early. Tap ↻ for another quote. Sessions stay on this phone and also show in Streak.</p>
 <p style="color:var(--mut);font-size:12px">Stillness · made for Alan by Hark</p>`);
 wireSegs();
 document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{S.theme=b.dataset.theme;save();applyLook();document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b))});
 $('vol').onchange=e=>{S.vol=+e.target.value;save();strike()};
 $('avol').onchange=e=>{S.ambVol=+e.target.value;save();if(S.ambient!=='off')previewAmbient(S.ambient)};
 $('resetLook').onclick=()=>{const keep={min:S.min,log:S.log};S=Object.assign({},D,keep);save();applyLook();$('soundBtn')&&($('soundBtn').textContent=SNAME[S.sound]);settings()};
}
$('menuBtn').onclick=settings;
const EMBED=new URLSearchParams(location.search).has('embed');
if($('wkBtn'))$('wkBtn').onclick=()=>{if(EMBED)parent.postMessage('stillness-close','*');else location.href='../streak/'};
if(EMBED){const b=document.createElement('button');b.textContent='‹ Streak';b.style.cssText='font:inherit;letter-spacing:2px;color:inherit';b.onclick=()=>{if(T)stop(true);parent.postMessage('stillness-close','*')};$('date').replaceWith(b)}
// fullscreen like a native app: installed apps open fullscreen via the manifest; in a browser tab, go fullscreen on first touch
(function(){const inApp=matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches||window.self!==window.top;
 if(inApp)return;const f=()=>{const d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen({navigationUI:'hide'}).catch(()=>{})};
 document.addEventListener('pointerdown',f,{once:true})})();

if($('soundBtn'))$('soundBtn').onclick=()=>{openSheet(`<h3>Sound</h3>
 <div class="opt"><span>Ending sound</span>${seg('sound',[['bowl','Bowl'],['gong','Gong'],['chime','Chime']])}</div>
 <div class="opt"><span>Background</span>${seg('ambient',[['off','Silence'],['rain','Rain'],['ocean','Ocean'],['brown','Hush'],['om','Om']])}</div>`);wireSegs()};
$('statsBtn').onclick=()=>{const v=Object.values(S.log);const mins=Math.round(v.reduce((a,l)=>a+l.s,0)/60);
 let dots='';for(let i=27;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const l=S.log[ds(d)];dots+=`<span title="${ds(d)}" style="width:14px;height:14px;border-radius:50%;display:inline-block;margin:3px;background:${l?'color-mix(in srgb,var(--glow) '+Math.round(Math.min(1,.35+l.s/1800)*100)+'%,transparent)':'rgba(255,255,255,.08)'}"></span>`}
 openSheet(`<h3>Your journey</h3><div class="stats"><div><b>${streak()}</b><span>day streak</span></div><div><b>${v.reduce((a,l)=>a+l.n,0)}</b><span>sessions</span></div><div><b>${mins}</b><span>minutes</span></div></div><div style="text-align:center;margin-top:10px">${dots}</div><p style="text-align:center;color:var(--mut);font-size:12px;letter-spacing:1px;margin-top:10px">LAST 4 WEEKS</p>`)};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
