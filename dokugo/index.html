<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1420">
<title>Dokugo</title>
<meta name="description" content="Dokugo means 'after reading.' Capture the passages that stayed with you.">
<meta name="apple-mobile-web-app-title" content="Dokugo">
<meta name="application-name" content="Dokugo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--txt:#eef1f6;--mut:rgba(238,241,246,.58);--line:rgba(255,255,255,.12);--glow:#f3d9a4;--card:rgba(255,255,255,.055);
--sky:radial-gradient(120% 80% at 50% 110%,#c98f6b 0%,#6d5a7a 28%,#2b3352 55%,#0e1420 85%);
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body[data-theme=dawn]{--sky:radial-gradient(120% 80% at 50% 110%,#ffd3a5 0%,#f2a7a0 26%,#8f8bc6 56%,#34416e 92%);--glow:#fff1d6}
body[data-theme=ocean]{--sky:radial-gradient(120% 80% at 50% 110%,#6fd6d6 0%,#2b7a9e 28%,#173a5e 58%,#07142a 90%);--glow:#c8f6f2}
body[data-theme=forest]{--sky:radial-gradient(120% 80% at 50% 110%,#b9cc8c 0%,#55806a 28%,#1f3b33 58%,#0a1613 90%);--glow:#e6f2c4}
body[data-theme=sakura]{--sky:radial-gradient(120% 80% at 50% 110%,#ffd3de 0%,#e59ab5 27%,#7a5a85 57%,#1f1830 90%);--glow:#ffe3ec}
body[data-theme=midnight]{--sky:radial-gradient(120% 80% at 50% 110%,#1b2131 0%,#090b11 50%,#000 85%);--glow:#cfd8ec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--txt);font-family:var(--sans);background:#0e1420;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:var(--glow)}
.sky{position:fixed;inset:0;background:var(--sky);z-index:0}
.sky::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.06) 0 1px,transparent 2px) 0 0/90px 90px,radial-gradient(circle at 70% 40%,rgba(255,255,255,.05) 0 1px,transparent 2px) 0 0/130px 130px}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) clamp(16px,4.5vw,36px) calc(env(safe-area-inset-bottom) + 120px)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--mut)}
.brand{display:flex;align-items:center;gap:10px}.brand b{font-family:var(--serif);font-weight:400;letter-spacing:3px;color:var(--txt);font-size:15px}
.brand i{font-style:normal;font-size:11px;letter-spacing:2px}
.icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--txt);flex:none}
svg.i{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hero{text-align:center;margin:5vh 0 3vh}
.hero .kanji{font-family:var(--serif);font-size:13px;letter-spacing:3px;text-transform:uppercase;font-family:var(--sans);font-size:11.5px;color:var(--mut)}
.hero h1{font-family:var(--serif);font-weight:400;font-style:italic;font-size:clamp(26px,7vw,40px);line-height:1.2;margin:10px auto 8px;max-width:560px;text-shadow:0 0 50px color-mix(in srgb,var(--glow) 35%,transparent)}
.hero p{color:var(--mut);font-size:14px;margin:0}
.capture{display:flex;flex-direction:column;align-items:center;margin:26px 0 8px}
.go{width:92px;height:92px;border-radius:50%;border:1px solid color-mix(in srgb,var(--glow) 60%,transparent);display:grid;place-items:center;background:color-mix(in srgb,var(--glow) 9%,transparent);box-shadow:0 0 50px color-mix(in srgb,var(--glow) 22%,transparent);position:relative}
.go::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--glow) 22%,transparent),transparent 70%);animation:breathe 9s ease-in-out infinite;z-index:-1}
@keyframes breathe{0%,100%{transform:scale(.85);opacity:.6}50%{transform:scale(1.12);opacity:1}}
.go svg{width:32px;height:32px;stroke:var(--txt);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.capture small{margin-top:14px;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
h2{font-family:var(--serif);font-weight:400;font-size:21px;margin:30px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2 small,.lbl{font-family:var(--sans);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);font-weight:400}
h2 button{font-family:var(--sans);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--glow)}
.reading{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.reading::-webkit-scrollbar{display:none}
.rcard{flex:0 0 min(84%,380px);scroll-snap-align:start;display:flex;gap:14px;align-items:center;text-align:left}
.cover{width:70px;aspect-ratio:2/3;border-radius:6px 10px 10px 6px;background:#3a3550 center/cover no-repeat;box-shadow:0 10px 26px rgba(0,0,0,.45),inset 3px 0 0 rgba(255,255,255,.12);flex:none;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:7px;font-family:var(--serif);font-size:10px;line-height:1.15;color:rgba(255,255,255,.85)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cover .badge{z-index:1}.cover span{position:relative}
.rcard .t{font-family:var(--serif);font-size:18px;line-height:1.2}.rcard .a{font-size:13px;color:var(--mut);margin-top:3px}
.prog{height:5px;border-radius:5px;background:rgba(255,255,255,.1);margin-top:12px;overflow:hidden}.prog span{display:block;height:100%;background:var(--glow);box-shadow:0 0 12px var(--glow);border-radius:5px}
.pmeta{font-size:12px;color:var(--mut);margin-top:6px;font-variant-numeric:tabular-nums}
.week{display:flex;justify-content:space-between;gap:6px}
.day{flex:1;text-align:center;font-size:11px;color:var(--mut);letter-spacing:1px}
.day i{display:block;width:30px;height:30px;margin:0 auto 6px;border-radius:50%;border:1px solid var(--line)}
.day.on i{background:color-mix(in srgb,var(--glow) 70%,transparent);border-color:var(--glow);box-shadow:0 0 14px color-mix(in srgb,var(--glow) 60%,transparent)}
.day.today{color:var(--txt)}
.stats{display:flex;justify-content:space-around;text-align:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.stats b{display:block;font-family:var(--serif);font-weight:400;font-size:28px}.stats span{font-size:11px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}
.quote{font-family:var(--serif);font-style:italic;font-size:clamp(19px,4.8vw,24px);line-height:1.45;margin:0}
.qmeta{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin-top:12px}
.refl{font-size:14.5px;line-height:1.5;color:var(--mut);margin-top:12px;padding-left:12px;border-left:2px solid color-mix(in srgb,var(--glow) 55%,transparent)}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;color:var(--mut);background:rgba(255,255,255,.03);white-space:nowrap}
.chip.on{border-color:var(--glow);color:var(--txt);background:color-mix(in srgb,var(--glow) 13%,transparent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.chips.scroll::-webkit-scrollbar{display:none}
.shelf{display:grid;align-items:start;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 14px;margin-top:16px}
@media(min-width:620px){.shelf{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(min-width:900px){.shelf{grid-template-columns:repeat(6,minmax(0,1fr))}}
.bk{text-align:left;min-width:0;display:block;width:100%}.bk .cover{width:100%;font-size:12px;padding:10px}
.bk .t{font-family:var(--serif);font-size:14px;line-height:1.2;margin-top:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk .a{font-size:11.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .prog{margin-top:7px;height:3px}
.badge{position:absolute;top:6px;right:6px;font-family:var(--sans);font-size:10px;padding:2px 7px;border-radius:999px;background:rgba(14,20,32,.75);color:var(--glow)}
.search{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(10px)}
.search input{flex:1;background:none;border:0;outline:0;font-size:15px}
.plist{display:grid;gap:14px;margin-top:14px}
@media(min-width:820px){.plist{grid-template-columns:1fr 1fr}}
.pas .quote{font-size:18px}
.pas .ft{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--mut)}
.pas .ft button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.pas .ft button.fav{color:var(--glow)}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mut);margin:8px 6px 0 0}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.empty .quote{color:var(--txt);margin-bottom:14px}
.empty p{max-width:420px;margin:8px auto;line-height:1.55;font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:999px;border:1px solid color-mix(in srgb,var(--glow) 60%,transparent);background:color-mix(in srgb,var(--glow) 12%,transparent);font-size:15px;color:var(--txt)}
.btn.ghost{border-color:var(--line);background:rgba(255,255,255,.04);color:var(--mut)}
.btn.sm{padding:9px 15px;font-size:13.5px}
.btn.full{width:100%}
.btn:disabled{opacity:.4}
.nav{max-width:calc(100vw - 20px);position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:3;display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(14,20,32,.72);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px clamp(9px,3vw,16px);border-radius:999px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.nav button.on{color:var(--txt);background:color-mix(in srgb,var(--glow) 14%,transparent)}
.nav .plus{width:52px;height:52px;padding:0;justify-content:center;border-radius:50%;border:1px solid color-mix(in srgb,var(--glow) 60%,transparent);background:color-mix(in srgb,var(--glow) 16%,transparent);color:var(--txt);margin:0 4px}
.nav .plus svg{width:24px;height:24px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.3s;z-index:6}.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;max-width:680px;margin:0 auto;max-height:92vh;overflow-y:auto;background:rgba(14,20,32,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:20px 22px calc(env(safe-area-inset-bottom) + 28px);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet .grab{width:44px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 4px;padding-right:44px}
.sheet .sub{color:var(--mut);font-size:13.5px;margin-bottom:16px}
.close{position:sticky;top:0;float:right;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--mut);background:rgba(14,20,32,.8);z-index:2}
.field{margin:14px 0}
.field label{display:block;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);outline:0;font-size:15px}
.field textarea{min-height:96px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus{border-color:color-mix(in srgb,var(--glow) 60%,transparent)}
.field select option{background:#141a28}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.results{display:grid;gap:10px;margin-top:10px}
.res{display:flex;gap:12px;align-items:center;text-align:left;padding:10px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.res .cover{width:46px;font-size:8px;padding:4px}
.res .t{font-family:var(--serif);font-size:16px;line-height:1.2}.res .a{font-size:12.5px;color:var(--mut);margin-top:2px}
.steps{display:flex;gap:6px;margin:4px 0 16px}.steps i{flex:1;height:3px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--glow)}
.bigopt{display:grid;gap:12px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.opt .icon{width:48px;height:48px}
.opt b{font-weight:500;font-size:15.5px;display:block}.opt span{font-size:13px;color:var(--mut)}
.orb{width:150px;height:150px;margin:20px auto;border-radius:50%;position:relative;display:grid;place-items:center}
.orb::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--glow) 34%,transparent),color-mix(in srgb,var(--glow) 8%,transparent) 60%,transparent 72%);animation:breathe 4s ease-in-out infinite}
.orb span{position:relative;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--mut);text-align:center}
.pagetext{max-height:46vh;overflow-y:auto;padding:14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-family:var(--serif);font-size:16px;line-height:1.65}
.pagetext s{text-decoration:none;cursor:pointer;border-radius:4px;padding:1px 0;transition:background .2s}
.pagetext s.sel{background:color-mix(in srgb,var(--glow) 40%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--glow) 40%,transparent);color:#fff}
.mic{width:76px;height:76px;border-radius:50%;margin:8px auto;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--glow) 60%,transparent);background:color-mix(in srgb,var(--glow) 10%,transparent)}
.mic svg{width:30px;height:30px;stroke:var(--txt);fill:none;stroke-width:1.6;stroke-linecap:round}
.mic.live{animation:pulse 1.4s ease-in-out infinite;background:color-mix(in srgb,var(--glow) 30%,transparent)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--glow) 45%,transparent)}50%{box-shadow:0 0 0 18px transparent}}
.center{text-align:center}
.note{font-size:12.5px;color:var(--mut);line-height:1.5}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.swatches{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 34px}
.sw{width:46px;height:46px;border-radius:50%;border:2px solid transparent;position:relative}
.sw.on{border-color:#fff}
.sw small{position:absolute;top:50px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mut);white-space:nowrap}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.setrow span small{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.bookhead{display:flex;gap:18px;align-items:flex-end;margin-bottom:6px}
.bookhead .cover{width:96px;font-size:12px;padding:10px}
.slider{width:100%;accent-color:var(--glow)}
.return{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 30px) 30px calc(env(safe-area-inset-bottom) + 30px);text-align:center}
.return.show{display:flex;animation:fade 1.2s}
.return .sky{position:absolute}
.return .glowbg{position:absolute;left:50%;top:44%;width:min(90vw,520px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--glow) 18%,transparent),transparent 66%);animation:breathe 12s ease-in-out infinite}
.return .in{position:relative;max-width:620px}
.return .quote{font-size:clamp(22px,5.8vw,32px)}
.return .rtop{position:absolute;top:calc(env(safe-area-inset-top) + 18px);left:22px;right:22px;display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--mut)}
.return .rbot{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 26px);left:0;right:0;display:flex;justify-content:center;gap:18px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%) translateY(20px);opacity:0;transition:.35s;z-index:12;padding:11px 18px;border-radius:999px;background:rgba(14,20,32,.92);border:1px solid var(--line);font-size:14px;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.hidden{display:none!important}
.fadein{animation:fade .5s}
</style>
</head>
<body>
<div class="sky"></div>
<div class="wrap" id="view"></div>
<nav class="nav" id="nav">
  <button data-v="today" class="on"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button data-v="shelf"><svg class="i" viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4z"/><path d="M16.5 4.5l3.8 1 -3.9 15.1-3.8-1"/></svg>Shelf</button>
  <button class="plus" id="navPlus" aria-label="Capture a passage"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-v="passages"><svg class="i" viewBox="0 0 24 24"><path d="M7 7h4v4c0 3-2 5-4 5M14 7h4v4c0 3-2 5-4 5"/></svg>Passages</button>
  <button data-v="return"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Return</button>
</nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><button class="close" id="closeSheet" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="grab"></div><div id="sheetBody"></div></div>
<div class="return" id="ret"></div>
<div class="toast" id="toast"></div>
<input type="file" id="filePick" accept="image/*" capture="environment" class="hidden">
<input type="file" id="importPick" accept=".json,application/json" class="hidden">
<script src="app.js"></script>
</body>
</html>
