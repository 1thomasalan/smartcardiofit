<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121218">
<title>Streak</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#121218;--card:#1d1d26;--card2:#262632;--txt:#f4f4f7;--mut:#9a9aab;--acc:#ff6a28;--acc2:#ffc83c;--ok:#3ddc84;--rest:#4aa3ff;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;height:100%;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding:18px 18px 100px}
h1{font-size:28px;margin:6px 0 2px;font-weight:800;letter-spacing:-.5px}
h2{font-size:15px;color:var(--mut);font-weight:600;margin:22px 0 10px;text-transform:uppercase;letter-spacing:1px}
.sub{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border-radius:var(--r);padding:18px}
.streak{display:flex;align-items:center;gap:16px}
.flame{font-size:54px;line-height:1;filter:drop-shadow(0 0 18px rgba(255,106,40,.5))}
.flame.off{filter:grayscale(1) opacity(.4)}
.big{font-size:44px;font-weight:800;line-height:1}
.week{display:flex;justify-content:space-between;margin-top:16px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.dot{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:15px}
.dot.done{background:var(--acc);color:#000}.dot.rest{background:var(--rest);color:#000}.dot.today{outline:2px solid var(--acc2);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:999px;background:var(--card2);font-weight:600}
.chip.on{background:var(--acc);color:#000}
.btn{display:block;width:100%;padding:18px;border-radius:18px;background:linear-gradient(135deg,var(--acc),#ff4d4d);color:#000;font-weight:800;font-size:19px;margin-top:18px;box-shadow:0 8px 30px rgba(255,106,40,.35)}
.btn.sec{background:var(--card2);color:var(--txt);box-shadow:none;font-size:16px;padding:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
input[type=range]{width:100%;accent-color:var(--acc)}
.hr{display:flex;gap:10px;align-items:center;background:#2a1a14;border:1px solid #5a2e1c;border-radius:14px;padding:10px 14px;font-size:14px;margin-top:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(18,18,24,.92);backdrop-filter:blur(12px);border-top:1px solid #23232e;padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:720px;margin:0 auto;display:flex}
nav button{flex:1;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mut)}
nav button span{font-size:22px}
nav button.on{color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ex{background:var(--card);border-radius:16px;padding:14px;text-align:left;position:relative;border:2px solid transparent;transition:.15s}
.ex.on{border-color:var(--acc);background:#2a1d18}
.ex .e{font-size:34px}.ex .n{font-weight:700;margin-top:6px;font-size:15px}.ex .t{font-size:12px;color:var(--mut);margin-top:2px}
.ex .ck{position:absolute;top:10px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:13px}
.ex.on .ck{background:var(--acc);color:#000}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:6px;background:#1f3326;color:var(--ok);margin-top:6px;font-weight:700}
/* player */
#player{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 20px)}
#player.show{display:flex}
.ptop{width:100%;max-width:520px;display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
.prog{width:100%;max-width:520px;height:6px;background:var(--card2);border-radius:3px;margin:12px 0 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.phase{margin-top:22px;font-weight:800;letter-spacing:2px;font-size:14px;text-transform:uppercase}
.ring{position:relative;width:min(72vw,320px);aspect-ratio:1;margin:14px 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .em{font-size:70px}.ring .tm{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.exname{font-size:28px;font-weight:800;text-align:center}
.cue{color:var(--mut);text-align:center;margin-top:6px;max-width:420px;font-size:15px}
.next{margin-top:14px;color:var(--mut);font-size:14px}
.ctrl{display:flex;gap:16px;margin-top:auto;padding-top:20px}
.cb{width:72px;height:72px;border-radius:50%;background:var(--card2);font-size:28px;display:grid;place-items:center}
.cb.main{width:88px;height:88px;background:var(--acc);color:#000;font-size:34px}
.done-screen{text-align:center;margin:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px}
.cal .h{color:var(--mut);padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:13px}
.cal .d.done{background:var(--acc);color:#000;font-weight:700}.cal .d.rest{background:var(--rest);color:#000}.cal .d.blank{background:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:16px;padding:14px;text-align:center}.stat b{display:block;font-size:26px}.stat small{color:var(--mut)}
.toggle{width:52px;height:30px;border-radius:15px;background:var(--card2);position:relative;transition:.2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--acc)}.toggle.on::after{left:25px}
.set{padding:14px 0;border-bottom:1px solid #26262f}
.list .it{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #26262f;font-size:15px}
.list .it span{color:var(--mut)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:600;font-size:14px}.seg button.on{background:var(--acc);color:#000}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#333;padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
.mind{display:flex;align-items:center;gap:14px;margin-top:12px;background:linear-gradient(135deg,#2b3352,#5b4a6e);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--txt)}
.mind .ic{font-size:34px}.mind .tx{flex:1}.mind b{display:block;font-size:17px}.mind small{color:#d9d3e6}.mind .go2{background:#f3d9a4;color:#1d1d26;border-radius:999px;padding:9px 16px;font-weight:800;font-size:14px}
.dot{position:relative}.dot .m{position:absolute;bottom:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#f3d9a4;border:2px solid var(--bg)}
#mindFrame{position:fixed;inset:0;z-index:30;display:none;background:#0e1420}#mindFrame.show{display:block}#mindFrame iframe{width:100%;height:100%;border:0}
</style>
</head>
<body>
<div class="app">
<main id="view"></main>
<nav><div class="in">
<button data-tab="home" class="on"><span>🔥</span>Today</button>
<button data-tab="ex"><span>💪</span>Exercises</button>
<button data-tab="mind"><span>🧘</span>Meditate</button>
<button data-tab="hist"><span>📅</span>History</button>
<button data-tab="set"><span>⚙️</span>Settings</button>
</div></nav>
</div>

<div id="player"></div>
<div id="toast"></div>
<div id="mindFrame"></div>

<script>
// ---------- Exercise library (low-impact, heart-friendly options flagged) ----------
const EX=[
 // warm-up
 {id:'march',n:'Marching in Place',e:'🚶',g:'Warm-up',low:1,cue:'Lift knees gently, swing your arms.'},
 {id:'armcirc',n:'Arm Circles',e:'🔄',g:'Warm-up',low:1,cue:'Small circles, then bigger. Switch direction halfway.'},
 {id:'hipcirc',n:'Hip Circles',e:'🌀',g:'Warm-up',low:1,cue:'Hands on hips, slow smooth circles.'},
 {id:'stepjack',n:'Step Jacks',e:'🙆',g:'Cardio',low:1,cue:'Step one foot out as arms go up. No jumping.'},
 {id:'jacks',n:'Jumping Jacks',e:'🤸',g:'Cardio',low:0,cue:'Light on your feet. Swap to step jacks anytime.'},
 {id:'highknee',n:'Low-Impact High Knees',e:'🦵',g:'Cardio',low:1,cue:'Brisk march, knees to hip height.'},
 {id:'shadow',n:'Shadow Boxing',e:'🥊',g:'Cardio',low:1,cue:'Soft knees, quick light punches. Keep breathing.'},
 {id:'skaters',n:'Step Skaters',e:'⛸️',g:'Cardio',low:1,cue:'Step side to side, reach across.'},
 // lower
 {id:'squat',n:'Squats',e:'🏋️',g:'Lower Body',low:1,cue:'Sit back, chest up, knees over toes.'},
 {id:'chairsq',n:'Chair Squats',e:'🪑',g:'Lower Body',low:1,cue:'Tap the chair lightly and stand back up.'},
 {id:'lunge',n:'Reverse Lunges',e:'🚶‍♂️',g:'Lower Body',low:1,cue:'Step back, lower gently, alternate legs.'},
 {id:'glute',n:'Glute Bridge',e:'🌉',g:'Lower Body',low:1,cue:'Squeeze glutes at the top. Breathe out as you lift.'},
 {id:'calf',n:'Calf Raises',e:'🦶',g:'Lower Body',low:1,cue:'Rise slowly, lower slowly. Hold a wall if needed.'},
 {id:'wallsit',n:'Wall Sit',e:'🧱',g:'Lower Body',low:1,cue:'Keep breathing, never hold your breath.'},
 {id:'sideleg',n:'Side Leg Raises',e:'🦿',g:'Lower Body',low:1,cue:'Lift with control, switch sides halfway.'},
 // upper
 {id:'wallpush',n:'Wall Push-ups',e:'🧍',g:'Upper Body',low:1,cue:'Body straight, lower chest toward the wall.'},
 {id:'inclpush',n:'Incline Push-ups',e:'🛋️',g:'Upper Body',low:1,cue:'Hands on a counter or couch. Smooth reps.'},
 {id:'pushup',n:'Push-ups',e:'💪',g:'Upper Body',low:0,cue:'Drop to knees anytime. Exhale as you push.'},
 {id:'dips',n:'Chair Dips',e:'🪑',g:'Upper Body',low:1,cue:'Elbows back, short range is fine.'},
 {id:'ytw',n:'Y-T-W Raises',e:'🙌',g:'Upper Body',low:1,cue:'Squeeze shoulder blades, make each letter.'},
 {id:'punchup',n:'Overhead Reaches',e:'☝️',g:'Upper Body',low:1,cue:'Reach up alternating arms, tall posture.'},
 // core
 {id:'deadbug',n:'Dead Bug',e:'🪲',g:'Core',low:1,cue:'Low back pressed down, opposite arm and leg.'},
 {id:'birddog',n:'Bird Dog',e:'🐕',g:'Core',low:1,cue:'Reach long, hold a beat, switch.'},
 {id:'standcrunch',n:'Standing Knee Crunch',e:'🧍‍♂️',g:'Core',low:1,cue:'Elbow to opposite knee, alternate.'},
 {id:'kneeplank',n:'Knee Plank',e:'📏',g:'Core',low:1,cue:'Breathe steadily. Long body from knees to head.'},
 {id:'plank',n:'Plank',e:'🪵',g:'Core',low:0,cue:'Keep breathing. Drop to knees anytime.'},
 {id:'sidebend',n:'Standing Side Bends',e:'↔️',g:'Core',low:1,cue:'Slide hand down your leg, switch sides.'},
 // stretch
 {id:'hamstr',n:'Hamstring Stretch',e:'🧘',g:'Cool-down',low:1,cue:'Hinge forward gently. No bouncing.'},
 {id:'quad',n:'Quad Stretch',e:'🦩',g:'Cool-down',low:1,cue:'Hold a wall, switch legs halfway.'},
 {id:'chest',n:'Chest Opener',e:'🫁',g:'Cool-down',low:1,cue:'Clasp hands behind, open chest, breathe slowly.'},
 {id:'childpose',n:"Child's Pose",e:'🙇',g:'Cool-down',low:1,cue:'Sink back, long slow breaths.'},
 {id:'breathe',n:'Slow Breathing',e:'🌬️',g:'Cool-down',low:1,cue:'In for 4, out for 6. Let your heart rate settle.'},
];
const GROUPS=['Warm-up','Cardio','Lower Body','Upper Body','Core','Cool-down'];
const byId=Object.fromEntries(EX.map(x=>[x.id,x]));

// ---------- State ----------
const KEY='streak-workout-v1';
const def={selected:EX.filter(x=>x.low).map(x=>x.id),minutes:10,interval:'40/20',warm:true,cool:true,voice:true,beep:true,hrcap:130,log:{},restPerWeek:1,best:0};
let S=Object.assign({},def,JSON.parse(localStorage.getItem(KEY)||'{}'));
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const ds=d=>{const z=new Date(d);z.setMinutes(z.getMinutes()-z.getTimezoneOffset());return z.toISOString().slice(0,10)};
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ds(d)};

function streak(){
  let n=0,d=today();
  if(!S.log[d]) d=addDays(d,-1); // today not done yet doesn't break streak
  while(S.log[d]){ if(S.log[d].type==='workout') n++; d=addDays(d,-1);} 
  return n;
}
function updateBest(){const s=streak();if(s>(S.best||0)){S.best=s;save()}}
function mind(){try{return JSON.parse(localStorage.getItem('stillness-v1')||'{}').log||{}}catch(_){return {}}}
function mindStreak(){const L=mind();let n=0,d=today();if(!L[d])d=addDays(d,-1);while(L[d]){n++;d=addDays(d,-1)}return n}
function restsThisWeek(){let c=0;for(let i=0;i<7;i++){const l=S.log[addDays(today(),-i)];if(l&&l.type==='rest')c++}return c}

// ---------- UI helpers ----------
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}
let tab='home';
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='mind'){openMind();return}tab=b.dataset.tab;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render();scrollTo(0,0)});

function openMind(){const m=$('#mindFrame');if(!m.firstChild)m.innerHTML='<iframe src="../stillness/?embed=1" allow="screen-wake-lock; autoplay; fullscreen"></iframe>';m.classList.add('show')}
window.addEventListener('message',e=>{if(e.data==='stillness-close'){$('#mindFrame').classList.remove('show');if(tab==='home')render()}});
function render(){({home,ex:exView,hist,set:settings})[tab]();}

function home(){
  const st=streak(),t=today(),doneToday=S.log[t];
  const hr=new Date().getHours();
  const greet=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
  const ML=mind();let week='';const labels=['S','M','T','W','T','F','S'];
  for(let i=6;i>=0;i--){const d=addDays(t,-i),l=S.log[d],dd=new Date(d+'T12:00:00');
    week+=`<div class="day"><div class="dot ${l?(l.type==='rest'?'rest':'done'):''} ${i===0?'today':''}">${l?(l.type==='rest'?'💤':'✓'):''}${ML[d]?'<i class="m"></i>':''}</div>${labels[dd.getDay()]}</div>`}
  const mt=ML[t],ms=mindStreak();
  const mins=[5,10,15,20,30].map(m=>`<button class="chip ${S.minutes===m?'on':''}" data-m="${m}">${m} min</button>`).join('');
  const ints=['30/15','40/20','45/15'].map(v=>`<button class="${S.interval===v?'on':''}" data-i="${v}">${v}s</button>`).join('');
  $('#view').innerHTML=`
  <p class="sub" style="margin:0">${greet}, Alan</p>
  <h1>${doneToday?(doneToday.type==='rest'?'Rest day logged':'Done for today 🎉'):'Ready to move?'}</h1>
  <div class="card" style="margin-top:14px">
    <div class="streak"><div class="flame ${st?'':'off'}">🔥</div><div><div class="big">${st}</div><div class="sub" style="margin:4px 0 0">day streak · best ${Math.max(S.best||0,st)}</div></div></div>
    <div class="week">${week}</div>
  </div>
  <a class="mind" href="#" id="mindCard"><div class="ic">🧘</div><div class="tx"><b>${mt?'Meditated today · '+Math.round(mt.s/60)+' min':'Stillness'}</b><small>${ms?ms+' day mindfulness streak':'A few quiet minutes to round out today'}</small></div><span class="go2">${mt?'Again':'Meditate'}</span></a>
  <h2>How long today?</h2>
  <div class="chips" id="mins">${mins}</div>
  <div style="margin-top:14px"><div class="row"><span class="sub" style="margin:0">Custom</span><b id="mv">${S.minutes} min</b></div>
  <input type="range" min="3" max="45" value="${S.minutes}" id="mr"></div>
  <h2>Work / rest</h2>
  <div class="seg" id="ints">${ints}</div>
  <div class="sub" style="margin-top:12px">${S.selected.length} exercises selected${S.warm?' · warm-up':''}${S.cool?' · cool-down':''}</div>
  <div class="hr">❤️ <div>Keep your heart rate under <b>${S.hrcap} BPM</b>. Check your watch and slow down if you get close.</div></div>
  <button class="btn" id="go">${doneToday&&doneToday.type==='workout'?'Do another':'Start workout'}</button>
  ${!doneToday?`<button class="btn sec" id="restbtn">💤 Log a rest day (${Math.max(0,S.restPerWeek-restsThisWeek())} left this week)</button>`:''}
  `;
  document.querySelectorAll('#mins .chip').forEach(c=>c.onclick=()=>{S.minutes=+c.dataset.m;save();home()});
  $('#mr').oninput=e=>{S.minutes=+e.target.value;$('#mv').textContent=S.minutes+' min'};$('#mr').onchange=()=>{save();home()};
  document.querySelectorAll('#ints button').forEach(c=>c.onclick=()=>{S.interval=c.dataset.i;save();home()});
  $('#go').onclick=startWorkout;
  $('#mindCard').onclick=e=>{e.preventDefault();openMind()};
  const rb=$('#restbtn'); if(rb) rb.onclick=()=>{if(restsThisWeek()>=S.restPerWeek){toast('No rest days left this week');return}S.log[t]={type:'rest'};save();toast('Rest day logged. Streak safe 💤');home()};
}

function exView(){
  let h=`<h1>Exercises</h1><p class="sub">Tap to choose what goes into your workouts. <span class="tag">LOW IMPACT</span> moves are easier on the heart and joints.</p>
  <div class="chips" style="margin-bottom:8px"><button class="chip" id="all">Select all</button><button class="chip" id="lowonly">Low impact only</button><button class="chip" id="none">Clear</button></div>`;
  for(const g of GROUPS){
    if(g==='Warm-up'||g==='Cool-down'){}
    h+=`<h2>${g}</h2><div class="grid">`+EX.filter(x=>x.g===g).map(x=>`<button class="ex ${S.selected.includes(x.id)?'on':''}" data-id="${x.id}"><div class="ck">${S.selected.includes(x.id)?'✓':''}</div><div class="e">${x.e}</div><div class="n">${x.n}</div><div class="t">${x.cue}</div>${x.low?'<span class="tag">LOW IMPACT</span>':''}</button>`).join('')+`</div>`;
  }
  $('#view').innerHTML=h;
  document.querySelectorAll('.ex').forEach(b=>b.onclick=()=>{const id=b.dataset.id,i=S.selected.indexOf(id);i>=0?S.selected.splice(i,1):S.selected.push(id);save();b.classList.toggle('on');b.querySelector('.ck').textContent=i>=0?'':'✓'});
  $('#all').onclick=()=>{S.selected=EX.map(x=>x.id);save();exView()};
  $('#lowonly').onclick=()=>{S.selected=EX.filter(x=>x.low).map(x=>x.id);save();exView()};
  $('#none').onclick=()=>{S.selected=[];save();exView()};
}

let calOffset=0;
function hist(){
  const now=new Date();const m=new Date(now.getFullYear(),now.getMonth()+calOffset,1);
  const days=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  let cal=['S','M','T','W','T','F','S'].map(x=>`<div class="h">${x}</div>`).join('');
  for(let i=0;i<m.getDay();i++)cal+='<div class="d blank"></div>';
  for(let d=1;d<=days;d++){const k=ds(new Date(m.getFullYear(),m.getMonth(),d)),l=S.log[k];cal+=`<div class="d ${l?(l.type==='rest'?'rest':'done'):''}">${d}</div>`}
  const ents=Object.entries(S.log).sort((a,b)=>b[0].localeCompare(a[0]));
  const w=ents.filter(e=>e[1].type==='workout');
  const totalMin=Math.round(w.reduce((a,e)=>a+(e[1].secs||0),0)/60);
  $('#view').innerHTML=`<h1>History</h1>
  <div class="stats" style="margin-top:14px"><div class="stat"><b>${streak()}</b><small>current</small></div><div class="stat"><b>${Math.max(S.best||0,streak())}</b><small>best streak</small></div><div class="stat"><b>${totalMin}</b><small>total min</small></div></div>
  <div class="card" style="margin-top:14px"><div class="row" style="margin-bottom:12px"><button class="chip" id="pv">‹</button><b>${m.toLocaleString('en-US',{month:'long',year:'numeric'})}</b><button class="chip" id="nx">›</button></div><div class="cal">${cal}</div></div>
  <h2>Recent</h2><div class="list">${ents.slice(0,20).map(([d,l])=>`<div class="it"><b>${new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</b><span>${l.type==='rest'?'💤 Rest day':`🔥 ${Math.round((l.secs||0)/60)} min · ${l.count||0} moves`}</span></div>`).join('')||'<p class="sub">No workouts yet. Your first one starts the streak.</p>'}</div>`;
  $('#pv').onclick=()=>{calOffset--;hist()};$('#nx').onclick=()=>{if(calOffset<0){calOffset++;hist()}};
}

function settings(){
  const tg=(k,l,s)=>`<div class="set row"><div><b>${l}</b>${s?`<div class="sub" style="margin:2px 0 0;font-size:13px">${s}</div>`:''}</div><button class="toggle ${S[k]?'on':''}" data-k="${k}"></button></div>`;
  $('#view').innerHTML=`<h1>Settings</h1>
  ${tg('warm','Auto warm-up','Starts every workout with 2 gentle moves')}
  ${tg('cool','Auto cool-down','Ends with stretches and slow breathing')}
  ${tg('voice','Voice coach','Announces each exercise')}
  ${tg('beep','Countdown beeps','Last 3 seconds of each interval')}
  <div class="set"><div class="row"><b>Heart rate reminder</b><b id="hrv">${S.hrcap} BPM</b></div><input type="range" min="100" max="160" value="${S.hrcap}" id="hrr"></div>
  <div class="set"><div class="row"><b>Rest days per week</b><b id="rpv">${S.restPerWeek}</b></div><div class="sub" style="font-size:13px;margin:2px 0 8px">A logged rest day keeps your streak alive.</div><input type="range" min="0" max="3" value="${S.restPerWeek}" id="rpr"></div>
  <h2>Your data</h2><p class="sub">Everything stays on this phone. Back it up before switching phones.</p>
  <button class="btn sec" id="exp">⬇️ Export backup</button><button class="btn sec" id="imp" style="margin-top:10px">⬆️ Import backup</button><input type="file" id="file" accept="application/json" hidden>
  <p class="sub" style="margin-top:24px;font-size:13px">Streak · built for Alan by Hark · Meditate opens Stillness right here · the gold dot on a day means you meditated in Stillness</p>`;
  document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{S[b.dataset.k]=!S[b.dataset.k];save();b.classList.toggle('on')});
  $('#hrr').oninput=e=>{S.hrcap=+e.target.value;$('#hrv').textContent=S.hrcap+' BPM';save()};
  $('#rpr').oninput=e=>{S.restPerWeek=+e.target.value;$('#rpv').textContent=S.restPerWeek;save()};
  $('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='streak-backup-'+today()+'.json';a.click()};
  $('#imp').onclick=()=>$('#file').click();
  $('#file').onchange=async e=>{try{S=Object.assign({},def,JSON.parse(await e.target.files[0].text()));save();toast('Backup restored');settings()}catch(_){toast('That file did not work')}};
}

// ---------- Workout engine ----------
let W=null,wake=null,actx=null;
function beep(f=880,d=.12){if(!S.beep)return;try{actx=actx||new AudioContext();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.start();o.stop(actx.currentTime+d)}catch(_){}}
function say(t){if(!S.voice||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1;speechSynthesis.speak(u)}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function buildPlan(){
  const [work,rest]=S.interval.split('/').map(Number);
  const total=S.minutes*60;const steps=[];
  const warmPool=EX.filter(x=>x.g==='Warm-up'),coolPool=EX.filter(x=>x.g==='Cool-down');
  let main=S.selected.map(id=>byId[id]).filter(x=>x&&x.g!=='Warm-up'&&x.g!=='Cool-down');
  if(!main.length) main=EX.filter(x=>x.low&&x.g!=='Warm-up'&&x.g!=='Cool-down');
  let used=0;
  const add=(ex,secs,kind)=>{steps.push({ex,secs,kind});used+=secs};
  if(S.warm&&total>=300){shuffle(warmPool).slice(0,2).forEach(x=>add(x,30,'warm'))}
  const coolTime=S.cool&&total>=300?60:0;
  let pool=shuffle(main),i=0,last=null;
  while(used+work+coolTime<=total){
    let ex=pool[i%pool.length];i++;if(i%pool.length===0)pool=shuffle(main);
    if(ex===last&&main.length>1){ex=pool[i%pool.length];i++}
    add(ex,work,'work');last=ex;
    if(used+rest+work+coolTime<=total) add(null,rest,'rest'); else break;
  }
  if(steps.length&&steps[steps.length-1].kind==='rest'){used-=steps.pop().secs}
  if(coolTime){shuffle(coolPool).slice(0,2).forEach(x=>add(x,30,'cool'))}
  return steps;
}

async function startWorkout(){
  const plan=buildPlan();
  W={plan,idx:-1,left:0,paused:false,elapsed:0,count:0,total:plan.reduce((a,s)=>a+s.secs,0)};
  try{actx=actx||new AudioContext();actx.resume()}catch(_){}
  try{wake=await navigator.wakeLock.request('screen')}catch(_){}
  $('#player').classList.add('show');
  // 5 second get ready
  W.ready=5;drawPlayer();say('Get ready. First up, '+nextName(0));
  W.timer=setInterval(tick,1000);
}
function nextName(i){const s=W.plan[i];return s?(s.ex?s.ex.n:'Rest'):'Finish'}
function nextStep(){
  W.idx++;
  if(W.idx>=W.plan.length) return finish();
  const s=W.plan[W.idx];W.left=s.secs;
  if(s.ex){W.count++;say(s.ex.n);if(navigator.vibrate)navigator.vibrate(200);beep(1200,.25)}
  else{say('Rest. Next, '+nextName(W.idx+1));if(navigator.vibrate)navigator.vibrate([100,80,100])}
  drawPlayer();
}
function tick(){
  if(W.paused)return;
  if(W.ready>0){W.ready--;if(W.ready<=3&&W.ready>0)beep();if(W.ready===0)nextStep();else drawPlayer();return}
  W.left--;W.elapsed++;
  if(W.left<=3&&W.left>0)beep();
  if(W.left<=0)nextStep();else drawPlayer();
}
function drawPlayer(){
  const p=$('#player');
  if(W.ready>0){p.innerHTML=`<div class="ptop"><span>Get ready</span><button id="x">✕</button></div><div class="phase" style="color:var(--acc2)">Starting in</div><div class="ring"><div class="c"><div class="tm" style="font-size:110px">${W.ready}</div></div></div><div class="exname">${nextName(0)}</div><div class="cue">${W.plan.length} intervals · ${Math.round(W.total/60)} min</div>`;$('#x').onclick=quit;return}
  const s=W.plan[W.idx],frac=s.secs?(s.secs-W.left)/s.secs:0;const col=s.kind==='rest'?'var(--rest)':s.kind==='work'?'var(--acc)':'var(--ok)';
  const C=2*Math.PI*45;const nx=W.plan[W.idx+1];
  const label={work:'Work',rest:'Rest',warm:'Warm-up',cool:'Cool-down'}[s.kind];
  const remain=W.total-W.elapsed;
  p.innerHTML=`<div class="ptop"><span>${W.count} / ${W.plan.filter(x=>x.ex).length} moves</span><span>${Math.floor(remain/60)}:${String(remain%60).padStart(2,'0')} left</span><button id="x">✕</button></div>
  <div class="prog"><i style="width:${W.elapsed/W.total*100}%"></i></div>
  <div class="phase" style="color:${col}">${label}</div>
  <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#262632" stroke-width="7"/><circle cx="50" cy="50" r="45" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" style="transition:stroke-dashoffset 1s linear"/></svg>
  <div class="c"><div class="em">${s.ex?s.ex.e:'😮‍💨'}</div><div class="tm">${W.left}</div></div></div>
  <div class="exname">${s.ex?s.ex.n:'Catch your breath'}</div>
  <div class="cue">${s.ex?s.ex.cue:'Breathe slowly. Glance at your watch: under '+S.hrcap+' BPM?'}</div>
  <div class="next">${nx?'Next: '+(nx.ex?nx.ex.e+' '+nx.ex.n:'Rest'):'Last one!'}</div>
  <div class="ctrl"><button class="cb" id="bk">⏮</button><button class="cb main" id="pp">${W.paused?'▶':'⏸'}</button><button class="cb" id="sk">⏭</button></div>`;
  $('#x').onclick=quit;$('#pp').onclick=()=>{W.paused=!W.paused;drawPlayer()};
  $('#sk').onclick=()=>{W.elapsed+=W.left;nextStep()};
  $('#bk').onclick=()=>{W.elapsed-= (s.secs-W.left);W.left=s.secs;drawPlayer()};
}
function cleanup(){clearInterval(W.timer);try{wake&&wake.release()}catch(_){}wake=null;if('speechSynthesis' in window)speechSynthesis.cancel()}
function quit(){
  if(W.elapsed>=60&&confirm('End workout early? It still counts toward your streak.')){return finish()}
  if(W.elapsed<60&&!confirm('Quit this workout?'))return;
  cleanup();$('#player').classList.remove('show');W=null;render();
}
function finish(){
  cleanup();const t=today();const prev=S.log[t];
  const secs=(prev&&prev.type==='workout'?prev.secs:0)+W.elapsed,count=(prev&&prev.type==='workout'?prev.count:0)+W.count;
  S.log[t]={type:'workout',secs,count};save();updateBest();
  say('Workout complete. Nice work, Alan.');beep(660,.15);setTimeout(()=>beep(990,.3),180);
  const st=streak();
  $('#player').innerHTML=`<div class="done-screen"><div style="font-size:90px">🔥</div><div class="big" style="font-size:64px">${st}</div><div class="sub">day streak</div><h1 style="margin-top:20px">Workout complete</h1><p class="sub">${Math.round(W.elapsed/60)} min · ${W.count} moves</p><button class="btn" id="ok" style="width:260px;margin:24px auto 0">Done</button></div>`;
  $('#ok').onclick=()=>{$('#player').classList.remove('show');W=null;tab='home';render()};
}

render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
// fullscreen like a native app: installed apps open fullscreen via the manifest; in a browser tab, go fullscreen on first touch
(function(){const inApp=matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches||window.self!==window.top;
 if(inApp)return;const f=()=>{const d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen({navigationUI:'hide'}).catch(()=>{})};
 document.addEventListener('pointerdown',f,{once:true})})();

window.addEventListener('pageshow',()=>{if(tab==='home'&&!W)render()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tab==='home'&&!W)render()});
</script>
</body>
